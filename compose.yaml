name: ${COMPOSE_PROJECT_NAME:-search-service-dev}

services:
  workspace:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DEVCONTAINER_GO_IMAGE: ${DEVCONTAINER_GO_IMAGE:-mcr.microsoft.com/devcontainers/go:1.26-bookworm}
    init: true
    command: sleep infinity
    working_dir: /workspaces/search-service
    volumes:
      - type: bind
        source: ..
        target: /workspaces/search-service
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-search}
      DB_USER: ${POSTGRES_USER:-search}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-local_development_only}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: ${PGVECTOR_IMAGE:-pgvector/pgvector:0.8.7-pg17-bookworm}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-search}
      POSTGRES_USER: ${POSTGRES_USER:-search}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_development_only}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  postgres_data:
